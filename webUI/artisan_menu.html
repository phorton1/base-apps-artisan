<!-- artisan_menu.html -->

<div class="ui-layout-north">
	<div class="artisan_menu_bar">

		<button
			class='artisan_menu_item'
			onclick="set_page('home')" >
			home
		</button>
		<button
			class='artisan_menu_item'
			onclick="set_page('explorer')" >
			explorer
		</button>
		<button
			class='artisan_menu_item'
			onclick="set_page('search')" >
			search
		</button>
		<button
			class='artisan_menu_item'
			onclick="toggleFullScreen()" >
			full_screen
		</button>
		<button
			class='artisan_menu_item my_menu_button'
			onclick="showMenu(false,this,'#system_submenu')" >
			system
		</button>
		<div class='artisan_menu_library_name'>
			Library Name
		</div>
	</div>
</div>

<!-- the 'system' button opens #system_submenu, which lives once
     in artisan.html (this file is included by all three pages) -->

<!-- end of artisan_menu.html -->
